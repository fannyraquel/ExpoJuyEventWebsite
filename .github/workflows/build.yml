name: Build & Deploy ExpoJuy Event Website to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garantizar un solo despliegue activo a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Verificar tipos de TypeScript
        run: npx tsc --noEmit

      - name: Construir el proyecto con Vite
        run: |
          npm run build
          cp dist/index.html dist/404.html
        env:
          VITE_API_BASE_URL: "https://api.expojuy.gob.ar/v1"
          VITE_ENABLE_SHA256_SIGNATURE: "true"

      - name: Subir artefacto para GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
