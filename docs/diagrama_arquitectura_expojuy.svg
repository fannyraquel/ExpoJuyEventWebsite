<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .title-dark { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #1E1B4B; text-anchor: middle; }
      .badge-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #4C1D95; text-anchor: middle; }
      .node-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0F172A; text-anchor: start; }
      .item-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: start; }
      .bullet { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #7209B7; font-weight: bold; }
      .region-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #1E1B4B; text-anchor: middle; }
      .connector { stroke: #94A3B8; stroke-width: 1.75; fill: none; stroke-linecap: round; }
      .connector-primary { stroke: #7209B7; stroke-width: 2.2; fill: none; }
      .card-shadow { filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.08)); }
      .card-shadow-sm { filter: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.05)); }
    </style>
    <linearGradient id="gradRoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209B7" />
      <stop offset="100%" stop-color="#560BAD" />
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DBECB" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="gradRegion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
  </defs>

  <!-- FONDO GENERAL DEL DIAGRAMA -->
  <rect x="0" y="0" width="900" height="820" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- ENCABEZADO TITULAR DE LA ARQUITECTURA -->
  <text x="450" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#7209B7" text-anchor="middle">ARQUITECTURA DE INFORMACIÓN Y NAVEGACIÓN</text>
  <text x="450" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="900" fill="#0F172A" text-anchor="middle">EXPOJUY 2026 • PORTAL DIGITAL</text>

  <!-- NODO CENTRAL SUPERIOR: INICIO -->
  <g class="card-shadow">
    <rect x="330" y="70" width="240" height="52" rx="26" fill="url(#gradRoot)" stroke="#A881FC" stroke-width="2" />
    <text x="450" y="102" class="title">INICIO (HOME)</text>
  </g>

  <!-- LÍNEA MAESTRA HORIZONTAL DE DISTRIBUCIÓN -->
  <path d="M 450 122 L 450 152" class="connector-primary" />
  <path d="M 90 152 L 810 152" class="connector-primary" />

  <!-- 7 LÍNEAS VERTICALES HACIA LAS SECCIONES -->
  <path d="M 90 152 L 90 180" class="connector" />
  <path d="M 210 152 L 210 180" class="connector" />
  <path d="M 330 152 L 330 180" class="connector" />
  <path d="M 450 152 L 450 180" class="connector" />
  <path d="M 570 152 L 570 180" class="connector" />
  <path d="M 690 152 L 690 180" class="connector" />
  <path d="M 810 152 L 810 180" class="connector" />

  <!-- ==================== COLUMNA 1: AGENDA ==================== -->
  <g class="card-shadow-sm">
    <rect x="30" y="180" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#7209B7" stroke-width="2" />
    <text x="90" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#7209B7" text-anchor="middle">AGENDA</text>

    <!-- Tarjeta de Contenidos -->
    <rect x="25" y="230" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M 90 218 L 90 230" class="connector" />
    
    <circle cx="40" cy="255" r="3" fill="#1DBECB" />
    <text x="50" y="259" class="item-text font-semibold">Jornadas</text>
    <text x="50" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">(Días 1 a 4)</text>

    <circle cx="40" cy="298" r="3" fill="#1DBECB" />
    <text x="50" y="302" class="item-text font-semibold">Actividades</text>
    <text x="50" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">(Cronograma)</text>

    <circle cx="40" cy="341" r="3" fill="#1DBECB" />
    <text x="50" y="345" class="item-text font-semibold">Info Eventos</text>
    <text x="50" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">(Estados y Sala)</text>
  </g>

  <!-- ==================== COLUMNA 2: EXPLORAR ==================== -->
  <g class="card-shadow-sm">
    <rect x="150" y="180" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#1DBECB" stroke-width="2" />
    <text x="210" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0891B2" text-anchor="middle">EXPLORAR</text>

    <!-- Tarjeta de Contenidos -->
    <rect x="145" y="230" width="130" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M 210 218 L 210 230" class="connector" />

    <circle cx="160" cy="255" r="3" fill="#7209B7" />
    <text x="170" y="259" class="item-text font-semibold">Contenidos</text>
    <text x="170" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">y Propuestas</text>

    <circle cx="160" cy="298" r="3" fill="#7209B7" />
    <text x="170" y="302" class="item-text font-semibold">Catálogo B2B</text>
    <text x="170" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">Expositores</text>

    <circle cx="160" cy="341" r="3" fill="#7209B7" />
    <text x="170" y="345" class="item-text font-semibold">Filtro Rubros</text>
    <text x="170" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">y Empresas</text>
  </g>

  <!-- ==================== COLUMNA 3: DESCUBRÍ JUJUY (CENTRAL AMPLIA) ==================== -->
  <g class="card-shadow-sm">
    <rect x="270" y="180" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#7209B7" stroke-width="2" />
    <text x="330" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#7209B7" text-anchor="middle">DESCUBRÍ JUJUY</text>

    <!-- Tarjeta de Regiones -->
    <rect x="270" y="230" width="120" height="205" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M 330 218 L 330 230" class="connector" />

    <!-- 4 Regiones en Chips -->
    <rect x="282" y="242" width="96" height="24" rx="12" fill="url(#gradRegion)" stroke="#A881FC" stroke-width="1" />
    <text x="330" y="258" class="region-tag">Puna</text>

    <rect x="282" y="274" width="96" height="24" rx="12" fill="url(#gradRegion)" stroke="#A881FC" stroke-width="1" />
    <text x="330" y="290" class="region-tag">Quebrada</text>

    <rect x="282" y="306" width="96" height="24" rx="12" fill="url(#gradRegion)" stroke="#A881FC" stroke-width="1" />
    <text x="330" y="322" class="region-tag">Valles</text>

    <rect x="282" y="338" width="96" height="24" rx="12" fill="url(#gradRegion)" stroke="#A881FC" stroke-width="1" />
    <text x="330" y="354" class="region-tag">Yungas</text>

    <!-- Conector de extensión transversal a submódulos de regiones -->
    <path d="M 330 362 L 330 380" class="connector-primary" />
    <text x="330" y="393" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7209B7" text-anchor="middle">TODAS LAS REGIONES:</text>
    <text x="330" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Turismo • Cultura</text>
    <text x="330" y="421" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Municipios • Empresas</text>
  </g>

  <!-- ==================== COLUMNA 4: RONDA DE NEGOCIOS ==================== -->
  <g class="card-shadow-sm">
    <rect x="390" y="180" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#1DBECB" stroke-width="2" />
    <text x="450" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0891B2" text-anchor="middle">RONDA DE</text>
    <text x="450" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0891B2" text-anchor="middle">NEGOCIOS</text>

    <!-- Tarjeta de Contenidos -->
    <rect x="390" y="230" width="120" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M 450 218 L 450 230" class="connector" />

    <circle cx="405" cy="255" r="3" fill="#1DBECB" />
    <text x="415" y="259" class="item-text font-semibold">Vinculación</text>
    <text x="415" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">Empresarial B2B</text>

    <circle cx="405" cy="298" r="3" fill="#1DBECB" />
    <text x="415" y="302" class="item-text font-semibold">Agendas</text>
    <text x="415" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">de Reuniones</text>

    <circle cx="405" cy="341" r="3" fill="#1DBECB" />
    <text x="415" y="345" class="item-text font-semibold">Corredor</text>
    <text x="415" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">Bioceánico</text>
  </g>

  <!-- ==================== COLUMNA 5: PLANO ==================== -->
  <g class="card-shadow-sm">
    <rect x="510" y="180" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#7209B7" stroke-width="2" />
    <text x="570" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#7209B7" text-anchor="middle">PLANO</text>

    <!-- Tarjeta de Contenidos -->
    <rect x="510" y="230" width="120" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M 570 218 L 570 230" class="connector" />

    <circle cx="525" cy="255" r="3" fill="#7209B7" />
    <text x="535" y="259" class="item-text font-semibold">Plano General</text>
    <text x="535" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">Ciudad Cultural</text>

    <circle cx="525" cy="298" r="3" fill="#7209B7" />
    <text x="535" y="302" class="item-text font-semibold">Ubicación</text>
    <text x="535" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">de Stands</text>

    <circle cx="525" cy="341" r="3" fill="#7209B7" />
    <text x="535" y="345" class="item-text font-semibold">Accesos</text>
    <text x="535" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">y Servicios</text>
  </g>

  <!-- ==================== COLUMNA 6: NOTICIAS ==================== -->
  <g class="card-shadow-sm">
    <rect x="630" y="180" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#1DBECB" stroke-width="2" />
    <text x="690" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0891B2" text-anchor="middle">NOTICIAS</text>

    <!-- Tarjeta de Contenidos -->
    <rect x="630" y="230" width="120" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M 690 218 L 690 230" class="connector" />

    <circle cx="645" cy="255" r="3" fill="#1DBECB" />
    <text x="655" y="259" class="item-text font-semibold">Novedades</text>
    <text x="655" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">del Evento</text>

    <circle cx="645" cy="298" r="3" fill="#1DBECB" />
    <text x="655" y="302" class="item-text font-semibold">Prensa</text>
    <text x="655" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">y Comunicados</text>

    <circle cx="645" cy="341" r="3" fill="#1DBECB" />
    <text x="655" y="345" class="item-text font-semibold">Cobertura</text>
    <text x="655" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">Multimedial</text>
  </g>

  <!-- ==================== COLUMNA 7: CONTACTO / ACREDITACIÓN ==================== -->
  <g class="card-shadow-sm">
    <rect x="750" y="180" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#7209B7" stroke-width="2" />
    <text x="810" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#7209B7" text-anchor="middle">CONTACTO /</text>
    <text x="810" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#7209B7" text-anchor="middle">ACREDITACIÓN</text>

    <!-- Tarjeta de Contenidos -->
    <rect x="750" y="230" width="120" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <path d="M 810 218 L 810 230" class="connector" />

    <circle cx="765" cy="255" r="3" fill="#7209B7" />
    <text x="775" y="259" class="item-text font-semibold">Acreditación</text>
    <text x="775" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">Visitantes Online</text>

    <circle cx="765" cy="298" r="3" fill="#7209B7" />
    <text x="775" y="302" class="item-text font-semibold">Formulario</text>
    <text x="775" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">de Contacto</text>

    <circle cx="765" cy="341" r="3" fill="#7209B7" />
    <text x="775" y="345" class="item-text font-semibold">Atención</text>
    <text x="775" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">al Expositor</text>
  </g>

  <!-- ==================== PANEL INFERIOR DE DETALLE DE LAS 4 REGIONES ==================== -->
  <g class="card-shadow-sm">
    <rect x="150" y="475" width="600" height="190" rx="12" fill="#FFFFFF" stroke="#A881FC" stroke-width="1.5" />
    
    <!-- Cinta superior del panel -->
    <rect x="150" y="475" width="600" height="32" rx="12" fill="#F3E8FF" />
    <text x="450" y="496" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#7209B7" text-anchor="middle">DESGLOSE DEL MÓDULO TERRITORIAL: "DESCUBRÍ JUJUY"</text>

    <!-- Conector desde el bloque central superior -->
    <path d="M 330 435 L 330 460 L 450 460 L 450 475" class="connector-primary" />

    <!-- 4 Sub-columnas correspondientes a las 4 regiones -->
    <!-- PUNA -->
    <g transform="translate(170, 520)">
      <rect x="0" y="0" width="125" height="130" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="62" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#7209B7" text-anchor="middle">Puna</text>
      <line x1="15" y1="26" x2="110" y2="26" stroke="#DDD6FE" />
      <text x="10" y="45" class="item-text">• Info turística</text>
      <text x="10" y="65" class="item-text">• Info cultural</text>
      <text x="10" y="85" class="item-text">• Municipios</text>
      <text x="10" y="105" class="item-text">• Empresas reg.</text>
    </g>

    <!-- QUEBRADA -->
    <g transform="translate(310, 520)">
      <rect x="0" y="0" width="125" height="130" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="62" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#7209B7" text-anchor="middle">Quebrada</text>
      <line x1="15" y1="26" x2="110" y2="26" stroke="#DDD6FE" />
      <text x="10" y="45" class="item-text">• Info turística</text>
      <text x="10" y="65" class="item-text">• Info cultural</text>
      <text x="10" y="85" class="item-text">• Municipios</text>
      <text x="10" y="105" class="item-text">• Empresas reg.</text>
    </g>

    <!-- VALLES -->
    <g transform="translate(450, 520)">
      <rect x="0" y="0" width="125" height="130" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="62" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#7209B7" text-anchor="middle">Valles</text>
      <line x1="15" y1="26" x2="110" y2="26" stroke="#DDD6FE" />
      <text x="10" y="45" class="item-text">• Info turística</text>
      <text x="10" y="65" class="item-text">• Info cultural</text>
      <text x="10" y="85" class="item-text">• Municipios</text>
      <text x="10" y="105" class="item-text">• Empresas reg.</text>
    </g>

    <!-- YUNGAS -->
    <g transform="translate(590, 520)">
      <rect x="0" y="0" width="125" height="130" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="62" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#7209B7" text-anchor="middle">Yungas</text>
      <line x1="15" y1="26" x2="110" y2="26" stroke="#DDD6FE" />
      <text x="10" y="45" class="item-text">• Info turística</text>
      <text x="10" y="65" class="item-text">• Info cultural</text>
      <text x="10" y="85" class="item-text">• Municipios</text>
      <text x="10" y="105" class="item-text">• Empresas reg.</text>
    </g>
  </g>

  <!-- ==================== PIE DE PÁGINA DEL DIAGRAMA ==================== -->
  <rect x="0" y="775" width="900" height="45" rx="0" fill="#0F172A" />
  <text x="450" y="802" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">MEMORIA TÉCNICA • EXPOJUY 2026 • CÁMARA DE COMERCIO EXTERIOR DE JUJUY</text>
</svg>
